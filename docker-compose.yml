version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: faulttrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: faulttrace
      POSTGRES_USER: faulttrace_user
      POSTGRES_PASSWORD: faulttrace_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faulttrace_user -d faulttrace"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
